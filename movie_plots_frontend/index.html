<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Catálogo de Filmes</title>
        <link rel="stylesheet" href="style.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <header>
            <button id="theme-toggle" class="theme-toggle-btn">
                ☀️ Modo Claro
            </button>
            <h1>Movie Plots</h1>
            <p>Explore as sinopses dos seus filmes favoritos</p>
        </header>

        <main>
            <section class="carousel-container">
                <div class="button-container">
                    <button
                        id="load-more"
                        class="load-more-btn"
                        style="display: none"
                    >
                        Carregar Mais Filmes
                    </button>
                </div>
                <div class="carousel" id="carousel">
                    <!-- Os cards dos filmes serão renderizados aqui via JavaScript -->
                    <div class="loading" id="loading">Carregando filmes...</div>
                </div>
            </section>
        </main>
        <footer class="footer">
            <p>
                &copy; 2026 Movie Plots Frontend - Pedro Zeferino da Silva.
                Todos os direitos reservados.
            </p>
        </footer>

        <script src="script.js"></script>
    </body>
</html>
